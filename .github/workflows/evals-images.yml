name: Build evaluation workers

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/evals-images.yml"
      - "infra/evals/Dockerfile*"
      - "lib/**"
      - "services/evals-*/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: worker
            dockerfile: infra/evals/Dockerfile
          - name: documents
            dockerfile: infra/evals/Dockerfile.documents
          - name: browser
            dockerfile: infra/evals/Dockerfile.browser
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_REPOSITORY }}:evals-${{ matrix.name }}-${{ github.sha }}

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: production-evals-deploy
      cancel-in-progress: false
    steps:
      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy evaluation workers to VPS
        run: |
          ssh -o StrictHostKeyChecking=no caudals@caudals-1 "DEPLOY_SHA=${{ github.sha }} bash -se" << 'INNEREOF'
            set -euo pipefail
            repo_dir=/home/caudals/caudals
            cd "$repo_dir"
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$DEPLOY_SHA" ]; then
              echo "A newer main commit superseded this worker deployment."
              exit 0
            fi
            worktree="$repo_dir/.worktrees/actions-evals-$DEPLOY_SHA"
            git worktree prune
            if [ -e "$worktree/.git" ]; then
              git worktree remove --force "$worktree"
            fi
            git worktree add --detach "$worktree" "$DEPLOY_SHA"
            trap 'git -C "$repo_dir" worktree remove --force "$worktree" >/dev/null 2>&1 || true' EXIT
            sudo EVALS_IMAGE_COMMIT="$DEPLOY_SHA" "$worktree/scripts/deploy-evals-production.sh"
          INNEREOF
