name: Build evaluation workers

on:
  push:
    branches: [main]
    paths:
      - "infra/evals/Dockerfile*"
      - "lib/**"
      - "services/evals-*/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "scripts/deploy-evals-production.sh"
  workflow_dispatch:
    inputs:
      mode:
        description: Build fresh evaluation images or deploy already-published images
        required: true
        default: build-and-deploy
        type: choice
        options:
          - build-and-deploy
          - deploy-existing-images
      image_commit:
        description: Full 40-character commit SHA for existing images; required for deploy-existing-images
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-push:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'build-and-deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: worker
            dockerfile: infra/evals/Dockerfile
          - name: playwright
            dockerfile: infra/evals/Dockerfile.playwright
    steps:
      - uses: actions/checkout@v5
      - name: Validate VPS deployment script
        run: bash -n scripts/deploy-evals-production.sh
      - name: Check pinned Playwright browser version
        if: ${{ matrix.name == 'playwright' }}
        run: |
          locked=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          grep -q "playwright@${locked} install" infra/evals/Dockerfile.playwright || {
            echo "infra/evals/Dockerfile.playwright must install browsers for playwright@${locked}" >&2
            exit 1
          }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_REPOSITORY }}:evals-${{ matrix.name }}-${{ github.sha }}
          # Reusing unchanged dependency layers keeps their digests identical
          # between releases, so the VPS stores them once for the current and
          # rollback images instead of once per release.
          cache-from: type=registry,ref=docker.io/${{ secrets.DOCKERHUB_REPOSITORY }}:buildcache-evals-${{ matrix.name }}
          cache-to: type=registry,ref=docker.io/${{ secrets.DOCKERHUB_REPOSITORY }}:buildcache-evals-${{ matrix.name }},mode=max

  deploy-to-vps:
    needs: build-and-push
    if: ${{ always() && (needs.build-and-push.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy-existing-images')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: production-vps-deploy
      cancel-in-progress: false
    env:
      DEPLOY_MODE: ${{ inputs.mode || 'build-and-deploy' }}
      REQUESTED_IMAGE_COMMIT: ${{ inputs.image_commit || '' }}
    steps:
      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy evaluation workers to VPS
        run: |
          set -euo pipefail
          image_commit="$GITHUB_SHA"
          if [[ "$DEPLOY_MODE" == "deploy-existing-images" ]]; then
            if [[ ! "$REQUESTED_IMAGE_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
              echo "A full 40-character image_commit is required for deploy-existing-images." >&2
              exit 1
            fi
            image_commit="$REQUESTED_IMAGE_COMMIT"
          fi

          ssh -o StrictHostKeyChecking=no caudals@caudals-1 "DEPLOY_SHA='$GITHUB_SHA' IMAGE_COMMIT='$image_commit' DEPLOY_RUN_ID='$GITHUB_RUN_ID' DEPLOY_RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' bash -se" << 'INNEREOF'
            set -euo pipefail
            repo_dir=/home/caudals/caudals
            cd "$repo_dir"
            git fetch origin main
            # Skip only when a newer main commit changes worker inputs (and so
            # builds its own images). Otherwise these are still the newest images.
            if [ "$(git rev-parse origin/main)" != "$DEPLOY_SHA" ]; then
              if ! git diff --quiet "$DEPLOY_SHA" origin/main -- infra/evals lib 'services/evals-*' \
                  package.json package-lock.json tsconfig.json scripts/deploy-evals-production.sh; then
                echo "A newer main commit changes worker inputs and supersedes this deployment."
                exit 0
              fi
              echo "Newer main commits do not change worker inputs; deploying these images."
            fi
            worktree="$repo_dir/.worktrees/actions-evals-$DEPLOY_SHA-$DEPLOY_RUN_ID-$DEPLOY_RUN_ATTEMPT"
            git worktree add --detach "$worktree" "$DEPLOY_SHA"
            trap 'git -C "$repo_dir" worktree remove --force "$worktree" >/dev/null 2>&1 || true' EXIT
            sudo env EVALS_IMAGE_COMMIT="$IMAGE_COMMIT" "$worktree/scripts/deploy-evals-production.sh"
          INNEREOF
