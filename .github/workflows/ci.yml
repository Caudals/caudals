name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - phase-1-operator-console

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Typecheck, Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci --ignore-scripts && exit 0
            echo "npm ci failed on attempt ${attempt}; retrying..."
            sleep 10
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Validate deployment scripts
        run: |
          bash -n scripts/deploy-app-stack.sh
          bash -n scripts/deploy-evals-production.sh

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: i18n parity
        run: npm run i18n:check-parity

      - name: Unit tests
        run: npm test -- --run

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci --ignore-scripts && exit 0
            echo "npm ci failed on attempt ${attempt}; retrying..."
            sleep 10
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        run: npx playwright test e2e/smoke.spec.ts --project=chromium
