name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - phase-1-operator-console

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Typecheck, Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci --ignore-scripts && exit 0
            echo "npm ci failed on attempt ${attempt}; retrying..."
            sleep 10
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Validate deployment scripts
        run: |
          bash -n scripts/deploy-app-stack.sh
          bash -n scripts/deploy-evals-production.sh

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # EN/ES parity (launch L-23, spec P-45). `npm run lint` above applies
      # the literal rule (caudals/no-ui-literals). The parity script checks
      # every catalogue (site, app, emails, PDF/Word, invoices, legal, help) and
      # the phrase table; the tests render the emails and the PDF/Word exports
      # in both languages and check the legal and help content. Seconds, not
      # minutes; the image build (Dockerfile) runs the same gate.
      - name: EN/ES parity
        run: |
          npm run i18n:check-parity
          npx vitest run tests/email/templates.test.ts tests/evals/report-language-parity.test.ts tests/i18n lib/legal lib/evals/help/content.test.ts

      - name: Unit tests
        run: npm test -- --run

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci --ignore-scripts && exit 0
            echo "npm ci failed on attempt ${attempt}; retrying..."
            sleep 10
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        run: npx playwright test e2e/smoke.spec.ts --project=chromium

      # Launch L-24 (P-46): axe on the core screens, focus in dialogs, live
      # progress, reduced motion and the keyboard-only funnel, in the UI
      # harness (no build, about a minute).
      - name: Accessibility contracts
        run: npx playwright test --config=e2e/evals/ui.config.ts a11y.contract.ts

  budgets:
    # Launch L-24 (P-47): Lighthouse budgets and axe on a production build of
    # the landing, the demo and sign-up. It builds the app (several minutes),
    # so it runs only when something that reaches those pages changed, and a
    # newer push to the same branch cancels it.
    name: Performance budgets
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    concurrency:
      group: budgets-${{ github.ref }}
      cancel-in-progress: true
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:4173
      NEXT_PUBLIC_APP_HOSTNAMES: localhost
      DEMO_PUBLIC: "true"
      SELF_SERVE_DIRECT_SIGNUP: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Did the public pages change?
        id: changes
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "ui=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^(app|components|packages/brand|public|e2e)/|^lib/(i18n|public|demo|legal|analytics|navigation)/|^(next\.config\.js|proxy\.ts|instrumentation-client\.ts|package-lock\.json|lighthouserc\.js|\.github/workflows/ci\.yml)$'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.changes.outputs.ui == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.ui == 'true'
        run: |
          for attempt in 1 2 3; do
            npm ci --ignore-scripts && exit 0
            echo "npm ci failed on attempt ${attempt}; retrying..."
            sleep 10
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Build
        if: steps.changes.outputs.ui == 'true'
        run: npm run build

      - name: Install Playwright browsers
        if: steps.changes.outputs.ui == 'true'
        run: npx playwright install --with-deps chromium

      - name: Axe on the served pages
        if: steps.changes.outputs.ui == 'true'
        run: |
          npm run start -- --port 4173 > /tmp/next.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://localhost:4173/en > /dev/null && break; sleep 1; done
          PLAYWRIGHT_BASE_URL=http://localhost:4173 npx playwright test e2e/a11y-public.spec.ts --project=chromium
          kill %1

      - name: Lighthouse, mobile
        if: steps.changes.outputs.ui == 'true'
        run: CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")" npx lhci autorun --config=./lighthouserc.js

      - name: Lighthouse, desktop
        if: steps.changes.outputs.ui == 'true'
        run: CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")" LHCI_FORM_FACTOR=desktop npx lhci autorun --config=./lighthouserc.js

      - name: Keep the Lighthouse reports
        if: always() && steps.changes.outputs.ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: lighthouse-reports/
          retention-days: 7
