name: Secret Scan

# Stand-in for GitHub's native secret scanning, which is unavailable on this
# org: the free plan gates Secret Protection behind a paid add-on for private
# repos. gitleaks gives the same two guarantees on any plan --
#   * "changes" blocks a secret from entering main (push-protection equivalent)
#   * "history" sweeps the whole repo on a schedule (backfill equivalent)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - phase-1-operator-console
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  changes:
    name: Scan new commits
    # A scheduled or manually dispatched run has no diff base to scan against;
    # the history job owns those. This job is for push and pull_request only.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Determine commit range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # A new branch, a force-push, or a manual dispatch gives no usable
          # base; fall back to scanning the full history rather than nothing.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "log_opts=--all" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=$base..$head" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan
        # --redact keeps the secret itself out of the workflow log, which is
        # readable by anyone with repo access.
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --log-opts "${{ steps.range.outputs.log_opts }}" \
            --redact \
            --verbose \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks-changes.sarif

      - name: Upload report
        if: ${{ always() && hashFiles('gitleaks-changes.sarif') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-changes-sarif
          path: gitleaks-changes.sarif
          retention-days: 30

  history:
    name: Scan full history
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan every commit on every branch
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --log-opts "--all" \
            --redact \
            --verbose \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks-history.sarif

      - name: Upload report
        if: ${{ always() && hashFiles('gitleaks-history.sarif') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-history-sarif
          path: gitleaks-history.sarif
          retention-days: 30
