name: Vercel Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    concurrency:
      group: production
      cancel-in-progress: true

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20 + cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore Next/Vercel build cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            .vercel/cache
          key: next-vercel-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts','**/*.tsx','**/*.js','**/*.jsx','**/*.cjs','**/*.mjs') }}
          restore-keys: |
            next-vercel-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-

      - name: Install deps
        run: npm ci

      - name: Pull Vercel env (production)
        run: npx -y vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build (prebuilt)
        run: npx -y vercel@latest build --token "$VERCEL_TOKEN"

      - name: Deploy (production)
        id: deploy
        run: |
          url=$(npx -y vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "prod_url=$url" >> $GITHUB_OUTPUT

      - name: Save Next/Vercel build cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            .vercel/cache
          key: next-vercel-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.run_id }}

      - name: Summary
        run: echo "✅ Production deployed: ${{ steps.deploy.outputs.prod_url }}"
