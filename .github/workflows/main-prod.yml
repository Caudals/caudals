name: Vercel Preview

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: ["**"]

jobs:
  deploy-preview:
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    concurrency:
      group: preview-${{ github.ref }}
      cancel-in-progress: true

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore Next/Vercel build cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            .vercel/cache
          key: next-vercel-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[tj]s','**/*.[tj]sx','**/*.mjs','**/*.cjs') }}
          restore-keys: |
            next-vercel-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-

      - run: npm ci

      - name: Pull Vercel env (preview)
        run: npx -y vercel@latest pull --yes --environment=preview --token "$VERCEL_TOKEN"

      - name: Ensure .env.local has Supabase vars
        run: |
          touch .env.local
          grep -qxF "NEXT_PUBLIC_SUPABASE_URL=" .env.local || echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env.local
          grep -qxF "NEXT_PUBLIC_SUPABASE_ANON_KEY=" .env.local || echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env.local
          grep -qxF "SUPABASE_URL=" .env.local || echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env.local
          grep -qxF "SUPABASE_ANON_KEY=" .env.local || echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env.local

      - name: Build (prebuilt)
        run: npx -y vercel@latest build --token "$VERCEL_TOKEN"

      - name: Deploy (preview)
        id: deploy
        run: |
          url=$(npx -y vercel@latest deploy --prebuilt --token "$VERCEL_TOKEN")
          echo "preview_url=$url" >> $GITHUB_OUTPUT

      - name: Save Next/Vercel build cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            .vercel/cache
          key: next-vercel-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.run_id }}

      - name: Comment PR with Preview URL
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.deploy.outputs.preview_url }}";
            if (url?.startsWith("https://")) {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `🚀 **Vercel Preview** listo: ${url}`
              });
            }
