name: Build and Push Docker image

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/**"
      - "docs/**"
      - "infra/evals/**"
      - "scripts/deploy-evals-production.sh"
      - "services/evals-*/**"
  workflow_dispatch:
    inputs:
      mode:
        description: Build a fresh app image or deploy an already-published image
        required: true
        default: build-and-deploy
        type: choice
        options:
          - build-and-deploy
          - deploy-existing-image
      image_commit:
        description: Full 40-character commit SHA for an existing image; required for deploy-existing-image
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: docker.io

jobs:
  build-and-push:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'build-and-deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_REPOSITORY }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate bilingual blog bundle
        run: |
          npm ci
          npm run blog:preflight

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          pull: true
          push: true
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Scan Docker image vulnerabilities
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          only-severities: critical,high
          sarif-file: docker-scout.sarif

      - name: Upload Docker Scout SARIF artifact
        if: ${{ always() && hashFiles('docker-scout.sarif') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-scout-sarif
          path: docker-scout.sarif
          retention-days: 30

  deploy-to-vps:
    needs: [build-and-push]
    if: ${{ always() && (needs.build-and-push.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy-existing-image')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: production-vps-deploy
      cancel-in-progress: false
    env:
      DEPLOY_MODE: ${{ inputs.mode || 'build-and-deploy' }}
      REQUESTED_IMAGE_COMMIT: ${{ inputs.image_commit || '' }}
    steps:
      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS
        run: |
          set -euo pipefail
          image_sha="$GITHUB_SHA"
          if [[ "$DEPLOY_MODE" == "deploy-existing-image" ]]; then
            if [[ ! "$REQUESTED_IMAGE_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
              echo "A full 40-character image_commit is required for deploy-existing-image." >&2
              exit 1
            fi
            image_sha="$REQUESTED_IMAGE_COMMIT"
          fi

          ssh -o StrictHostKeyChecking=no caudals@caudals-1 "DEPLOY_SHA='$GITHUB_SHA' IMAGE_SHA='$image_sha' DEPLOY_RUN_ID='$GITHUB_RUN_ID' DEPLOY_RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' bash -se" << 'INNEREOF'
            set -euo pipefail
            repo_dir=/home/caudals/caudals
            cd "$repo_dir"
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$DEPLOY_SHA" ]; then
              echo "A newer main commit superseded this deployment."
              exit 0
            fi
            worktree="$repo_dir/.worktrees/actions-app-$DEPLOY_SHA-$DEPLOY_RUN_ID-$DEPLOY_RUN_ATTEMPT"
            git worktree add --detach "$worktree" "$DEPLOY_SHA"
            trap 'git -C "$repo_dir" worktree remove --force "$worktree" >/dev/null 2>&1 || true' EXIT
            sudo env CAUDALS_APP_BUILD_LOCAL=false CAUDALS_APP_BUILD_TAG="$IMAGE_SHA" "$worktree/scripts/deploy-app-stack.sh"
          INNEREOF
