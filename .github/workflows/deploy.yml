name: Build and Push Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: docker.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_REPOSITORY }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate bilingual blog bundle
        run: |
          npm ci
          npm run blog:preflight

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          pull: true
          push: true
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Scan Docker image vulnerabilities
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          only-severities: critical,high
          sarif-file: docker-scout.sarif

      - name: Upload Docker Scout SARIF artifact
        if: ${{ always() && hashFiles('docker-scout.sarif') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-scout-sarif
          path: docker-scout.sarif
          retention-days: 30

  deploy-to-vps:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    concurrency:
      group: production-app-deploy
      cancel-in-progress: false
    steps:
      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no caudals@caudals-1 "DEPLOY_SHA=${{ github.sha }} bash -se" << 'INNEREOF'
            cd /home/caudals/caudals
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$DEPLOY_SHA" ]; then
              echo "A newer main commit superseded this deployment."
              exit 0
            fi
            git reset --hard "$DEPLOY_SHA"
            sudo CAUDALS_APP_BUILD_LOCAL=false scripts/deploy-app-stack.sh
          INNEREOF
