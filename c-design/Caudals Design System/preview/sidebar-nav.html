<!doctype html>
<html><head><meta charset="utf-8"><title>Sidebar nav</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:0;background:#fff;font-family:var(--font-sans);display:flex;height:380px;}
aside{width:236px;background:#f9fafb;padding:18px 14px;border-right:1px solid #f3f4f6;flex-shrink:0;}
.brand{display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:18px;}
.brand img{width:22px;height:22px;}
.brand span{font:500 16px var(--font-sans);letter-spacing:-.01em;color:#111827;}
.section-lbl{font:700 10px var(--font-sans);color:#9ca3af;text-transform:uppercase;letter-spacing:.12em;padding:0 10px;margin:14px 0 6px;}
.item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;font:600 13px var(--font-sans);color:#6b7280;cursor:pointer;}
.item .ic{width:14px;height:14px;color:#9ca3af;font-weight:bold;}
.item:hover{background:rgba(255,255,255,.6);color:#111827;}
.item.active{background:#ecfdf5;color:#047857;border:1px solid #d1fae5;}
.item.active .ic{color:#047857;}
.main{flex:1;background:#fff;padding:24px;}
.crumb{font:600 12px var(--font-sans);color:#9ca3af;margin-bottom:6px;}
.title{font:400 28px/1.1 var(--font-sans);letter-spacing:-.02em;color:#111827;}
</style></head>
<body>
<aside>
  <div class="brand"><img src="../assets/caudals_logo_black.svg"/><span>Caudals</span></div>
  <div class="section-lbl">Workspace</div>
  <div class="item active"><span class="ic">▤</span>Dashboard</div>
  <div class="item"><span class="ic">▦</span>Catalog</div>
  <div class="item"><span class="ic">☰</span>Requests</div>
  <div class="item"><span class="ic">$</span>Billing</div>
  <div class="item"><span class="ic">⚙</span>Settings</div>
  <div class="section-lbl">Datasets</div>
  <div class="item"><span class="ic">●</span>Fleet GPS Q4</div>
  <div class="item"><span class="ic">●</span>Retail patterns</div>
</aside>
<div class="main"><div class="crumb">Requester · Workspace</div><div class="title">Dashboard</div></div>
</body></html>
