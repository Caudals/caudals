<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing & Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans);}
h4{font:700 10px/1.2 var(--font-sans);color:var(--fg-3);text-transform:uppercase;letter-spacing:.12em;margin:0 0 10px;}
.row{display:flex;align-items:flex-end;gap:10px;margin-bottom:18px;}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px;}
.box{background:#ecfdf5;border:1px solid #d1fae5;}
.tag{font:500 10px var(--font-mono);color:var(--fg-3);}
.r{background:#111827;color:#fff;font:700 10px/1 var(--font-sans);display:flex;align-items:center;justify-content:center;width:64px;height:48px;}
</style></head>
<body>
<h4>Spacing · 4-pt scale</h4>
<div class="row">
  <div class="cell"><div class="box" style="width:4px;height:32px;"></div><div class="tag">4</div></div>
  <div class="cell"><div class="box" style="width:8px;height:32px;"></div><div class="tag">8</div></div>
  <div class="cell"><div class="box" style="width:12px;height:32px;"></div><div class="tag">12</div></div>
  <div class="cell"><div class="box" style="width:16px;height:32px;"></div><div class="tag">16</div></div>
  <div class="cell"><div class="box" style="width:20px;height:32px;"></div><div class="tag">20</div></div>
  <div class="cell"><div class="box" style="width:24px;height:32px;"></div><div class="tag">24</div></div>
  <div class="cell"><div class="box" style="width:32px;height:32px;"></div><div class="tag">32</div></div>
  <div class="cell"><div class="box" style="width:40px;height:32px;"></div><div class="tag">40</div></div>
  <div class="cell"><div class="box" style="width:48px;height:32px;"></div><div class="tag">48</div></div>
  <div class="cell"><div class="box" style="width:64px;height:32px;"></div><div class="tag">64</div></div>
</div>
<h4>Radii</h4>
<div class="row">
  <div class="cell"><div class="r" style="border-radius:6px;">6</div><div class="tag">xs</div></div>
  <div class="cell"><div class="r" style="border-radius:8px;">8</div><div class="tag">sm</div></div>
  <div class="cell"><div class="r" style="border-radius:10px;">10</div><div class="tag">md · default</div></div>
  <div class="cell"><div class="r" style="border-radius:12px;">12</div><div class="tag">lg</div></div>
  <div class="cell"><div class="r" style="border-radius:14px;">14</div><div class="tag">shell</div></div>
  <div class="cell"><div class="r" style="border-radius:16px;">16</div><div class="tag">xl · cards</div></div>
  <div class="cell"><div class="r" style="border-radius:9999px;">∞</div><div class="tag">pill</div></div>
</div>
</body></html>
