<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:28px 24px;background:#fff;font-family:var(--font-sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;gap:18px;color:#0b0f1a;}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .lbl{font:600 11px/1.2 var(--font-sans);color:#9ca3af;width:84px;flex-shrink:0;}

  /* ---- Core button ---- */
  .btn{
    position:relative;appearance:none;border:0;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font:600 13px/1 var(--font-sans);letter-spacing:-.005em;
    height:38px;padding:0 16px;border-radius:8px;
    transition:transform .15s cubic-bezier(.22,1,.36,1),
               box-shadow .18s cubic-bezier(.22,1,.36,1),
               background .15s, color .15s, border-color .15s;
    white-space:nowrap;
  }
  .btn:active{transform:translateY(.5px);}
  .btn:focus-visible{outline:0;box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(5,150,105,.55);}
  .btn .arr{transition:transform .2s cubic-bezier(.22,1,.36,1);display:inline-block;}
  .btn:hover .arr{transform:translateX(2px);}

  /* Primary — near-black with subtle inner highlight, crisp shadow */
  .primary{
    color:#fff;
    background:linear-gradient(180deg,#1f2937 0%,#0b0f1a 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.08),
      inset 0 -1px 0 rgba(0,0,0,.35),
      0 1px 2px rgba(11,15,26,.2),
      0 2px 6px -2px rgba(11,15,26,.25);
  }
  .primary:hover{background:linear-gradient(180deg,#273142 0%,#111827 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -1px 0 rgba(0,0,0,.35),0 4px 10px -2px rgba(11,15,26,.35);}

  /* Accent — emerald, used rarely (confirm / success actions) */
  .accent{
    color:#fff;
    background:linear-gradient(180deg,#10b981 0%,#047857 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.22),
      inset 0 -1px 0 rgba(4,47,35,.45),
      0 1px 2px rgba(4,120,87,.25),
      0 4px 12px -4px rgba(4,120,87,.4);
  }
  .accent:hover{filter:brightness(1.04);}

  /* Secondary — clean white card, precise border + 1px inner highlight */
  .secondary{
    color:#0b0f1a;background:#fff;
    border:1px solid #e5e7eb;
    box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(11,15,26,.04);
  }
  .secondary:hover{background:#fafafa;border-color:#d4d8df;box-shadow:inset 0 1px 0 #fff,0 2px 6px -2px rgba(11,15,26,.08);}

  /* Ghost — no chrome until hover */
  .ghost{color:#0b0f1a;background:transparent;}
  .ghost:hover{background:#f3f4f6;}

  /* Tinted — soft accent chip, reads as a link action */
  .tinted{
    color:#047857;background:#ecfdf5;
    box-shadow:inset 0 0 0 1px rgba(5,150,105,.18);
  }
  .tinted:hover{background:#d1fae5;}

  /* Danger — crimson, subtle inner highlight */
  .danger{
    color:#fff;
    background:linear-gradient(180deg,#ef4444 0%,#b91c1c 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 2px rgba(185,28,28,.25),0 4px 12px -4px rgba(185,28,28,.4);
  }
  .danger:hover{filter:brightness(1.04);}

  /* Disabled */
  .btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(11,15,26,.04);}

  /* Sizes */
  .sm{height:30px;font-size:12px;padding:0 12px;border-radius:6px;gap:6px;}
  .lg{height:48px;font-size:14px;padding:0 22px;border-radius:10px;}
  .xl{height:56px;font-size:15px;padding:0 28px;border-radius:9999px;letter-spacing:-.01em;}

  /* Icon-only square */
  .icon{width:36px;padding:0;}

  /* Leading dot for status-like action */
  .dot{width:6px;height:6px;border-radius:9999px;background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.18);}
</style></head>
<body>

<div class="row"><div class="lbl">Hierarchy</div>
  <button class="btn primary">Request access <span class="arr">→</span></button>
  <button class="btn secondary">Browse catalog</button>
  <button class="btn ghost">Cancel</button>
  <button class="btn tinted">View sample</button>
  <button class="btn accent">Confirm delivery</button>
  <button class="btn danger">Archive</button>
</div>

<div class="row"><div class="lbl">Sizes</div>
  <button class="btn primary sm">Sign up</button>
  <button class="btn primary">Sign up</button>
  <button class="btn primary lg">Sign up</button>
  <button class="btn primary xl">I need a dataset <span class="arr">→</span></button>
</div>

<div class="row"><div class="lbl">Utility</div>
  <button class="btn secondary"><span class="dot"></span>Live preview</button>
  <button class="btn secondary icon" aria-label="More">⋯</button>
  <button class="btn secondary icon" aria-label="Search">⌕</button>
  <button class="btn primary" disabled>Submitting…</button>
</div>

</body></html>
