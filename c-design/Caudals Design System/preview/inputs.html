<!doctype html>
<html><head><meta charset="utf-8"><title>Form Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);display:flex;flex-direction:column;gap:14px;}
label{display:block;font:600 13px/1 var(--font-sans);color:#111827;margin-bottom:6px;}
input,textarea{width:100%;box-sizing:border-box;font:400 14px/1.4 var(--font-sans);padding:9px 12px;border:1px solid #e5e7eb;background:#fff;border-radius:6px;outline:none;color:#111827;box-shadow:0 1px 2px 0 rgba(0,0,0,0.05);}
input::placeholder,textarea::placeholder{color:#9ca3af;}
input:focus{border-color:#059669;box-shadow:0 0 0 3px rgba(5,150,105,.18);}
.row{display:flex;gap:14px;}
.row > div{flex:1;}
.waitlist{position:relative;display:flex;align-items:center;}
.waitlist input{height:48px;border-radius:9999px;background:rgba(255,255,255,.6);padding:0 130px 0 20px;border:1px solid rgba(229,231,235,.8);}
.waitlist button{position:absolute;right:4px;height:40px;background:#000;color:#fff;border:0;border-radius:9999px;font:700 13px var(--font-sans);padding:0 18px;cursor:pointer;}
.help{font:500 12px var(--font-sans);color:#9ca3af;margin-top:6px;}
.err{font:600 12px var(--font-sans);color:#dc2626;margin-top:6px;}
</style></head>
<body>
<div class="row">
  <div><label>Work email</label><input placeholder="you@company.com" value="alex@northwind.io"/></div>
  <div><label>Industry</label><input placeholder="e.g. Logistics"/></div>
</div>
<div><label>What data do you need?</label><textarea rows="2" placeholder="Describe the dataset, volume, and format…"></textarea><div class="help">We'll scope the opportunity within 24 hours.</div></div>
<div class="waitlist"><input placeholder="Enter your work email"/><button>Request access</button></div>
</body></html>
