<!doctype html>
<html><head><meta charset="utf-8"><title>Stat Tiles</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:32px;background:#fff;font-family:var(--font-sans);-webkit-font-smoothing:antialiased;color:#0b0f1a;}
  .wrap{display:grid;grid-template-columns:1.2fr 1.6fr;gap:40px;align-items:stretch;max-width:980px;}

  /* ---------- Editorial headline stat ---------- */
  .hero-stat{display:flex;flex-direction:column;justify-content:center;padding:6px 0;}
  .hero-stat .kicker{font:600 11px/1.2 var(--font-sans);color:#0b0f1a;margin-bottom:18px;display:inline-flex;align-items:center;gap:8px;}
  .hero-stat .kicker::before{content:"";width:18px;height:1px;background:#0b0f1a;display:inline-block;}
  .hero-stat .num{font:400 84px/.92 var(--font-sans);letter-spacing:-.04em;color:#0b0f1a;font-variant-numeric:tabular-nums;}
  .hero-stat .num em{font:italic 400 1em "New York","Iowa",Georgia,serif;color:#0b0f1a;}
  .hero-stat .lbl{margin-top:18px;font:600 14px var(--font-sans);color:#0b0f1a;letter-spacing:-.01em;}
  .hero-stat .desc{margin-top:6px;font:400 12px/1.55 var(--font-sans);color:#6b7280;max-width:260px;}

  /* ---------- Inline stat strip (no cards) ---------- */
  .strip{display:grid;grid-template-columns:1fr 1fr 1fr;column-gap:0;row-gap:0;align-self:center;}
  .cell{padding:4px 24px;display:flex;flex-direction:column;gap:8px;border-left:1px solid #eceef2;}
  .cell:first-child{border-left:0;padding-left:0;}
  .cell .lbl{font:500 12px/1.2 var(--font-sans);color:#6b7280;letter-spacing:-.005em;}
  .cell .row{display:flex;align-items:baseline;gap:8px;}
  .cell .num{font:400 30px/1 var(--font-sans);letter-spacing:-.022em;color:#0b0f1a;font-variant-numeric:tabular-nums;}
  .cell .delta{display:inline-flex;align-items:center;gap:3px;font:600 11px var(--font-sans);color:#047857;letter-spacing:-.005em;}
  .cell .delta.down{color:#b91c1c;}
  .cell .delta svg{width:10px;height:10px;}

  /* ---------- Sparkline ---------- */
  .spark{margin-top:2px;height:26px;width:100%;display:block;}
  .spark path.line{fill:none;stroke:#0b0f1a;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
  .spark path.area{fill:rgba(11,15,26,.06);stroke:none;}
  .spark.accent path.line{stroke:#059669;}
  .spark.accent path.area{fill:rgba(5,150,105,.1);}
  .spark .last{fill:#0b0f1a;}
  .spark.accent .last{fill:#059669;}
</style></head>
<body>
<div class="wrap">

  <div class="hero-stat">
    <div class="kicker">Median delivery</div>
    <div class="num">&lt;2<em>w</em></div>
    <div class="lbl">From brief to bucket</div>
    <div class="desc">Median time from dataset brief to validated, ML-ready delivery, across the last 90 days.</div>
  </div>

  <div class="strip">
    <div class="cell">
      <div class="lbl">Datasets delivered</div>
      <div class="row">
        <span class="num">1,284</span>
        <span class="delta"><svg viewBox="0 0 10 10" fill="currentColor"><path d="M5 1l4 5H1z"/></svg>24%</span>
      </div>
      <svg class="spark" viewBox="0 0 120 26" preserveAspectRatio="none">
        <path class="area" d="M0,22 L10,20 L22,18 L34,19 L46,14 L58,12 L70,10 L82,11 L94,7 L106,5 L120,3 L120,26 L0,26 Z"/>
        <path class="line" d="M0,22 L10,20 L22,18 L34,19 L46,14 L58,12 L70,10 L82,11 L94,7 L106,5 L120,3"/>
        <circle class="last" cx="120" cy="3" r="2"/>
      </svg>
    </div>

    <div class="cell">
      <div class="lbl">Quality score</div>
      <div class="row">
        <span class="num" style="color:#047857;">98.4%</span>
        <span class="delta"><svg viewBox="0 0 10 10" fill="currentColor"><path d="M5 1l4 5H1z"/></svg>0.6%</span>
      </div>
      <svg class="spark accent" viewBox="0 0 120 26" preserveAspectRatio="none">
        <path class="area" d="M0,14 L10,12 L22,13 L34,10 L46,11 L58,8 L70,9 L82,6 L94,7 L106,5 L120,4 L120,26 L0,26 Z"/>
        <path class="line" d="M0,14 L10,12 L22,13 L34,10 L46,11 L58,8 L70,9 L82,6 L94,7 L106,5 L120,4"/>
        <circle class="last" cx="120" cy="4" r="2"/>
      </svg>
    </div>

    <div class="cell">
      <div class="lbl">Supplier companies</div>
      <div class="row">
        <span class="num">142</span>
        <span class="delta"><svg viewBox="0 0 10 10" fill="currentColor"><path d="M5 1l4 5H1z"/></svg>18%</span>
      </div>
      <svg class="spark" viewBox="0 0 120 26" preserveAspectRatio="none">
        <path class="area" d="M0,20 L12,19 L24,17 L36,18 L48,15 L60,13 L72,14 L84,10 L96,9 L108,7 L120,6 L120,26 L0,26 Z"/>
        <path class="line" d="M0,20 L12,19 L24,17 L36,18 L48,15 L60,13 L72,14 L84,10 L96,9 L108,7 L120,6"/>
        <circle class="last" cx="120" cy="6" r="2"/>
      </svg>
    </div>
  </div>

</div>
</body></html>
