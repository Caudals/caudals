<!doctype html>
<html><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:30px 20px;background:#f9fafb;font-family:var(--font-sans);display:flex;gap:18px;align-items:center;}
.s{background:#fff;border-radius:14px;padding:16px;flex:1;text-align:center;}
.s .name{font:700 11px var(--font-sans);color:#111827;}
.s .hex{font:500 10px var(--font-mono);color:var(--fg-3);margin-top:4px;display:block;}
.x1{box-shadow:0 1px 2px 0 rgba(0,0,0,0.05);}
.x2{box-shadow:0 1px 2px rgba(0,0,0,0.02);}
.x3{box-shadow:0 10px 30px rgba(0,0,0,0.08);}
.x4{box-shadow:0 22px 45px -25px rgba(15,23,42,0.25);}
.x5{box-shadow:0 48px 120px -56px rgba(15,23,42,0.62);}
</style></head>
<body>
  <div class="s x1"><div class="name">shadow-xs</div><span class="hex">inputs · buttons</span></div>
  <div class="s x2"><div class="name">surface</div><span class="hex">resting cards</span></div>
  <div class="s x3"><div class="name">overlay</div><span class="hex">popovers · sheets</span></div>
  <div class="s x4"><div class="name">soft-lg</div><span class="hex">hover lift</span></div>
  <div class="s x5"><div class="name">hero</div><span class="hex">marquee preview</span></div>
</body></html>
