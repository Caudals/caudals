<!doctype html>
<html><head><meta charset="utf-8"><title>Type Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);}
.row{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;}
.lbl{font:700 10px/1 var(--font-sans);color:var(--fg-3);text-transform:uppercase;letter-spacing:.12em;width:90px;flex-shrink:0;}
em{font:italic 400 1em/1 "New York","Iowa",Georgia,serif;color:rgba(15,118,110,.9);}
.h{font-weight:400;letter-spacing:-.02em;color:#111827;}
</style></head>
<body>
<div class="row"><div class="lbl">Hero · 96</div><div class="h" style="font-size:64px;line-height:1.05;letter-spacing:-.03em;">Datasets <em>tailored</em></div></div>
<div class="row"><div class="lbl">Display · 56</div><div class="h" style="font-size:40px;">Section headline</div></div>
<div class="row"><div class="lbl">H2 · 36</div><div class="h" style="font-size:28px;">Subsection title</div></div>
<div class="row"><div class="lbl">H3 · 20 / 700</div><div style="font:700 20px/1.3 var(--font-sans);color:#111827;">Card title</div></div>
</body></html>
