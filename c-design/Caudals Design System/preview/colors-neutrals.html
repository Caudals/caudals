<!doctype html>
<html><head><meta charset="utf-8"><title>Surfaces & Text</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans);}
.row{display:flex;gap:10px;}
.sw{flex:1;border-radius:10px;overflow:hidden;border:1px solid #f3f4f6;}
.cap{height:64px;display:flex;align-items:flex-end;padding:8px 10px;}
.meta{padding:8px 10px;background:#fff;border-top:1px solid #f3f4f6;}
.name{font:700 11px/1.2 var(--font-sans);color:var(--fg-1);}
.hex{font:500 10px/1.2 var(--font-mono);color:var(--fg-3);margin-top:3px;}
h4{font:700 10px/1.2 var(--font-sans);color:var(--fg-3);text-transform:uppercase;letter-spacing:.12em;margin:0 0 10px;}
.section{margin-bottom:14px;}
</style></head>
<body>
<div class="section"><h4>Surfaces & borders</h4>
<div class="row">
  <div class="sw"><div class="cap" style="background:#f9fafb;"></div><div class="meta"><div class="name">canvas</div><div class="hex">#f9fafb</div></div></div>
  <div class="sw"><div class="cap" style="background:#fff;border-bottom:1px solid #f3f4f6;"></div><div class="meta"><div class="name">surface</div><div class="hex">#ffffff</div></div></div>
  <div class="sw"><div class="cap" style="background:#f3f4f6;"></div><div class="meta"><div class="name">border-soft</div><div class="hex">#f3f4f6</div></div></div>
  <div class="sw"><div class="cap" style="background:#e5e7eb;"></div><div class="meta"><div class="name">border-strong</div><div class="hex">#e5e7eb</div></div></div>
</div></div>
<div class="section"><h4>Text ramp</h4>
<div class="row">
  <div class="sw"><div class="cap" style="background:#111827;"></div><div class="meta"><div class="name">fg-1</div><div class="hex">#111827</div></div></div>
  <div class="sw"><div class="cap" style="background:#6b7280;"></div><div class="meta"><div class="name">fg-2</div><div class="hex">#6b7280</div></div></div>
  <div class="sw"><div class="cap" style="background:#9ca3af;"></div><div class="meta"><div class="name">fg-3</div><div class="hex">#9ca3af</div></div></div>
  <div class="sw"><div class="cap" style="background:#fff;border:1px solid #f3f4f6;"></div><div class="meta"><div class="name">fg-inverse</div><div class="hex">#ffffff</div></div></div>
</div></div>
</body></html>
