<!doctype html>
<html><head><meta charset="utf-8"><title>Brand Mark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#f9fafb;display:flex;align-items:center;gap:32px;height:152px;box-sizing:border-box;}
.tile{width:104px;height:104px;border-radius:14px;display:flex;align-items:center;justify-content:center;border:1px solid #f3f4f6;}
.lbl{font:700 11px/1.2 var(--font-sans);color:var(--fg-3);text-transform:uppercase;letter-spacing:.12em;margin-top:8px;text-align:center;}
.col{display:flex;flex-direction:column;align-items:center;}
.wm{display:flex;align-items:center;gap:10px;}
.wm img{width:32px;height:32px;}
.wm span{font:500 24px/1 var(--font-sans);letter-spacing:-.02em;color:var(--fg-1);}
</style></head>
<body>
  <div class="col"><div class="tile" style="background:#fff;"><img src="../assets/caudals_logo_black.svg" style="width:64px;height:64px;"/></div><div class="lbl">Mark · light</div></div>
  <div class="col"><div class="tile" style="background:#111827;"><img src="../assets/caudals_logo_white.svg" style="width:64px;height:64px;"/></div><div class="lbl">Mark · dark</div></div>
  <div class="col"><div class="tile" style="background:#fff;padding:8px;box-sizing:border-box;"><img src="../assets/caudals_icon.svg" style="width:88px;height:88px;border-radius:10px;"/></div><div class="lbl">App icon</div></div>
  <div style="height:104px;width:1px;background:#f3f4f6;"></div>
  <div class="col" style="align-items:flex-start;"><div class="wm"><img src="../assets/caudals_logo_black.svg"/><span>Caudals</span></div><div class="lbl" style="text-align:left;">Wordmark · header lockup</div></div>
</body></html>
