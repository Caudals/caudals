<!doctype html>
<html><head><meta charset="utf-8"><title>Badges & Tags</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);display:flex;flex-direction:column;gap:16px;}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.lbl{font:600 11px/1.2 var(--font-sans);color:var(--fg-3);width:96px;flex-shrink:0;}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:6px;font:600 11px/1.4 var(--font-sans);border:1px solid transparent;}
.b-success{background:#ecfdf5;color:#047857;}
.b-warn{background:#fffbeb;color:#92400e;}
.b-info{background:#eff6ff;color:#1d4ed8;}
.b-neutral{background:#f3f4f6;color:#374151;}
.b-outline{background:#fff;color:#111827;border-color:#e5e7eb;}
.dot-badge{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 9px;border-radius:9999px;font:600 12px/1.3 var(--font-sans);}
.dot{width:6px;height:6px;border-radius:9999px;}
.eye{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:9999px;background:rgba(255,255,255,.6);border:1px solid rgba(204,251,241,.6);font:600 13px var(--font-sans);color:#0f5e4a;backdrop-filter:blur(8px);}
</style></head>
<body>
<div class="row"><div class="lbl">Status</div>
  <span class="badge b-success">Available</span>
  <span class="badge b-warn">Closing soon</span>
  <span class="badge b-info">Completed</span>
  <span class="badge b-neutral">Paused</span>
  <span class="badge b-outline">Draft</span>
</div>
<div class="row"><div class="lbl">Dot pill</div>
  <span class="dot-badge" style="background:#ecfdf5;color:#065f46;"><span class="dot" style="background:#059669;"></span>Live</span>
  <span class="dot-badge" style="background:#ecfdf5;color:#047857;"><span class="dot" style="background:#10b981;"></span>Available now</span>
  <span class="dot-badge" style="background:#f3f4f6;color:#374151;"><span class="dot" style="background:#9ca3af;"></span>Processing</span>
  <span class="dot-badge" style="background:#fffbeb;color:#92400e;"><span class="dot" style="background:#d97706;"></span>Closing soon</span>
</div>
<div class="row"><div class="lbl">Hero chip</div>
  <span class="eye"><span class="dot" style="background:#059669;"></span>B2B data marketplace for AI teams</span>
</div>
</body></html>
