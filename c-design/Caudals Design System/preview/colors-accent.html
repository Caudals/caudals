<!doctype html>
<html><head><meta charset="utf-8"><title>Brand Accent</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans);}
.row{display:flex;gap:10px;}
.sw{flex:1;border-radius:10px;overflow:hidden;border:1px solid #f3f4f6;}
.cap{height:64px;}
.meta{padding:8px 10px;background:#fff;border-top:1px solid #f3f4f6;}
.name{font:700 11px/1.2 var(--font-sans);color:var(--fg-1);}
.hex{font:500 10px/1.2 var(--font-mono);color:var(--fg-3);margin-top:3px;}
h4{font:700 10px/1.2 var(--font-sans);color:var(--fg-3);text-transform:uppercase;letter-spacing:.12em;margin:0 0 10px;}
.cta-row{display:flex;align-items:center;gap:10px;margin-top:14px;}
.btn{font:700 12px/1 var(--font-sans);border-radius:6px;padding:10px 14px;}
.btn-primary{background:#111827;color:#fff;}
.btn-accent{background:#059669;color:#fff;}
.eyebrow{font:700 13px/1.2 var(--font-sans);color:#059669;}
.italic-display{font:400 22px/1.1 var(--font-sans);letter-spacing:-.02em;color:#111827;margin-left:auto;}
.italic-display em{font:italic 400 1em/1 "New York","Iowa",Georgia,serif;color:rgba(15,118,110,.9);}
</style></head>
<body>
<h4>Brand accent — emerald / teal</h4>
<div class="row">
  <div class="sw"><div class="cap" style="background:#ecfdf5;"></div><div class="meta"><div class="name">accent-soft</div><div class="hex">#ecfdf5</div></div></div>
  <div class="sw"><div class="cap" style="background:#d1fae5;"></div><div class="meta"><div class="name">accent-soft-2</div><div class="hex">#d1fae5</div></div></div>
  <div class="sw"><div class="cap" style="background:#059669;"></div><div class="meta"><div class="name">accent</div><div class="hex">#059669</div></div></div>
  <div class="sw"><div class="cap" style="background:#047857;"></div><div class="meta"><div class="name">accent-hover</div><div class="hex">#047857</div></div></div>
  <div class="sw"><div class="cap" style="background:#0f766e;"></div><div class="meta"><div class="name">accent-teal · display</div><div class="hex">#0f766e</div></div></div>
</div>
<div class="cta-row">
  <span class="eyebrow">Capabilities</span>
  <button class="btn btn-primary">Request access</button>
  <button class="btn btn-accent" style="display:none;">Accent never primary</button>
  <span class="italic-display">datasets <em>tailored</em></span>
</div>
</body></html>
