version: "3.8"

# Production App runtime. Traefik routing is kept in a dynamic file because the
# same service must be reachable publicly and by other services over the private
# overlay network. No application port is published on the host.

services:
  app:
    image: ${CAUDALS_APP_IMAGE:?CAUDALS_APP_IMAGE is required}
    networks:
      dokploy-network:
        aliases:
          - caudals-app
    environment:
      NODE_ENV: production
      PORT: "3000"
      EVALS_DATASET_SIGNING_KEY_FILE: /run/secrets/evals_dataset_signing_key
      EVALS_RUNNER_SIGNING_KEY_FILE: /run/secrets/evals_runner_signing_key
      EVALS_SYNTHETIC_TARGET_TOKEN_FILE: /run/secrets/evals_synthetic_target_token
      EVALS_WEBHOOK_KEYRING_FILE: /run/secrets/evals_webhook_keyring
      EVALS_WEBHOOK_KEY_VERSION: v1
      # Encrypt-only use in the web process: its database role cannot read
      # stored envelopes, and only the fenced worker invocation decrypts.
      EVALS_MASTER_KEYRING_FILE: /run/secrets/evals_master_keyring
      EVALS_MASTER_KEY_VERSION: v1
      DO_SPACES_ENDPOINT: ${CAUDALS_OBJECT_STORAGE_ENDPOINT:-http://caudals-object-storage-minio:9000}
      DO_SPACES_FORCE_PATH_STYLE: "true"
      DO_SPACES_REGION: ${CAUDALS_OBJECT_STORAGE_REGION:-us-east-1}
      DO_SPACES_BUCKET: ${CAUDALS_OBJECT_STORAGE_BUCKET:-caudals-storage}
      NEXT_PUBLIC_DO_SPACES_CDN_URL: ${CAUDALS_OBJECT_STORAGE_CDN_URL:-http://caudals-object-storage-minio:9000/caudals-storage}
      DO_SPACES_ACCESS_KEY_ID_FILE: /run/secrets/object_storage_access_key
      DO_SPACES_SECRET_ACCESS_KEY_FILE: /run/secrets/object_storage_secret_key
    secrets:
      - app_runtime_env
      - evals_dataset_signing_key
      - evals_runner_signing_key
      - evals_synthetic_target_token
      - evals_webhook_keyring
      - evals_master_keyring
      - object_storage_access_key
      - object_storage_secret_key
    # Nothing in the image reads the runtime secret, so the start command
    # exports it before starting Next.js. A missing file makes `.` exit the
    # shell, so the task fails and the update rolls back instead of serving
    # without configuration. `docker exec` does not inherit this environment.
    command:
      - sh
      - -c
      - set -a; . /run/secrets/app_runtime_env; set +a; exec npm run start
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 2m
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 45s
      rollback_config:
        parallelism: 1
        order: stop-first
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
      labels:
        - "traefik.enable=false"

networks:
  dokploy-network:
    external: true
    name: ${CAUDALS_APP_NETWORK:-dokploy-network}

secrets:
  app_runtime_env:
    external: true
    name: ${CAUDALS_APP_ENV_SECRET:?CAUDALS_APP_ENV_SECRET is required}
  evals_dataset_signing_key:
    external: true
    name: ${CAUDALS_EVALS_DATASET_SIGNING_KEY_SECRET:?CAUDALS_EVALS_DATASET_SIGNING_KEY_SECRET is required}
  evals_runner_signing_key:
    external: true
    name: ${CAUDALS_EVALS_RUNNER_SIGNING_KEY_SECRET:?CAUDALS_EVALS_RUNNER_SIGNING_KEY_SECRET is required}
  evals_synthetic_target_token:
    external: true
    name: caudals_evals_synthetic_target_token
  evals_webhook_keyring:
    external: true
    name: caudals_evals_webhook_keyring
  evals_master_keyring:
    external: true
    name: caudals_evals_master_keyring
  object_storage_access_key:
    external: true
    name: ${CAUDALS_OBJECT_STORAGE_ACCESS_KEY_SECRET:-caudals_object_storage_access_key_id}
  object_storage_secret_key:
    external: true
    name: ${CAUDALS_OBJECT_STORAGE_SECRET_KEY_SECRET:-caudals_object_storage_secret_access_key}
