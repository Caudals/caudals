apiVersion: 1

datasources:
  - name: Caudals Prometheus
    uid: caudals-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Caudals Loki
    uid: caudals-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false

  - name: Caudals Tempo
    uid: caudals-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: caudals-loki
        filterByTraceID: true
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
      tracesToMetrics:
        datasourceUid: caudals-prometheus
