# Traefik dynamic route for connect.caudals.com on atlantic, installed as
# /etc/dokploy/traefik/dynamic/caudals-connect.yml by scripts/deploy-connect.sh.
http:
  routers:
    caudals-connect-web:
      rule: Host(`connect.caudals.com`)
      service: caudals-connect
      middlewares:
        - redirect-to-https
      entryPoints:
        - web
    caudals-connect-websecure:
      rule: Host(`connect.caudals.com`)
      service: caudals-connect
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
  services:
    caudals-connect:
      loadBalancer:
        servers:
          - url: http://caudals-connect:8080
        passHostHeader: true
