# connect.caudals.com: the founders' event contact cards, a static build of
# services/connect served by nginx-unprivileged on :8080 behind dokploy-traefik.
# Short links (/mario, /alonso, /setup, /) pick a language from the first
# Accept-Language tag; keep negotiate() in services/connect/src/site/routes.ts
# in step with this map.

map $http_accept_language $connect_lang {
    default es;
    "~*^\s*(es|ca|gl|eu)\b" es;
    "~*^\s*[a-z]" en;
}

map $uri $connect_cache {
    default "no-cache";
    "~^/assets/" "public, max-age=31536000, immutable";
    "~^/(media|icons)/" "public, max-age=604800";
    "/favicon.svg" "public, max-age=604800";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;
    charset utf-8;
    charset_types text/css text/plain application/javascript application/json image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css text/plain text/vcard application/javascript application/json application/manifest+json image/svg+xml;

    include /etc/nginx/snippets/connect-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        include /etc/nginx/snippets/connect-headers.conf;
        add_header Vary "Accept-Language" always;
        return 302 /$connect_lang/;
    }

    # Named capture: evaluating the regex map below resets $1.
    location ~ "^/(?<card>mario|alonso|setup)/?$" {
        include /etc/nginx/snippets/connect-headers.conf;
        add_header Vary "Accept-Language" always;
        return 302 /$connect_lang/$card/$is_args$args;
    }

    location ~ "^/(es|en)(/(mario|alonso|setup))?$" {
        return 301 $uri/$is_args$args;
    }

    location ~ "\.vcf$" {
        types { }
        default_type "text/vcard; charset=utf-8";
        try_files $uri =404;
    }

    location ~ "\.webmanifest$" {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
