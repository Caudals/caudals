server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  charset utf-8;
  server_tokens off;
  absolute_redirect off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header X-Robots-Tag "noindex, follow" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
  add_header Cache-Control "no-cache" always;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/vcard;
  location = / { return 302 /es/; }
  location = /mario { return 302 /es/mario; }
  location = /alonso { return 302 /es/alonso; }
  location = /es/mario/ { return 308 /es/mario; }
  location = /es/alonso/ { return 308 /es/alonso; }
  location = /en/mario/ { return 308 /en/mario; }
  location = /en/alonso/ { return 308 /en/alonso; }
  location ~ \.vcf$ { types { text/vcard vcf; } try_files $uri =404; }
  location ~ \.webmanifest$ { types { application/manifest+json webmanifest; } try_files $uri =404; }
  location / { try_files $uri/index.html $uri =404; }
  error_page 404 /404.html;
}
