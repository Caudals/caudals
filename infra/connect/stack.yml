version: '3.8'
services:
  web:
    image: ${CAUDALS_CONNECT_IMAGE:?CAUDALS_CONNECT_IMAGE is required}
    networks:
      dokploy-network:
        aliases: [caudals-connect]
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 30s
      resources:
        limits:
          memory: 64M
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=false
networks:
  dokploy-network:
    external: true
